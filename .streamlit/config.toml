# Streamlit's default cap is 200 MB. That is too permissive for this pipeline:
# the audio is base64-encoded into a single JSON body to call Gemini, which
# measures at ~5x peak RSS against the raw bytes, so a 200 MB upload needs about
# 1 GB and would hit the free-tier ceiling.
#
# This cap ALSO governs st.audio_input: a mic recording arrives as a WAV
# UploadedFile and is subject to server.maxUploadSize (per Streamlit's own
# audio_input docstring). st.audio_input always emits mono 16-bit PCM WAV at
# rate*2 bytes/sec, so at the 16 kHz default a 60-minute recording is ~110 MB.
# 120 MB therefore lets a full one-hour recording arrive and be compressed to
# ~14 MB MP3 before analysis, while refusing anything larger.
#
# Measured worst case at this cap: ~245 MB peak RSS (24% of the 1 GB Community
# Cloud ceiling), for a 60-min recording transcoded to MP3.
[server]
maxUploadSize = 120
